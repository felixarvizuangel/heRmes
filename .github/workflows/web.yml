# Publica la versión web de heRmes en GitHub Pages para usarla en el iPhone
# (Safari → Compartir → Añadir a pantalla de inicio) sin Mac ni App Store.
#
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
# URL final: https://felixarvizuangel.github.io/heRmes/
name: heRmes web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app_uth/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write     # subir el sitio
  id-token: write  # lo pide actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - name: flutter build web
        working-directory: app_uth
        # --base-href = nombre del repo, porque Pages sirve en /heRmes/
        run: |
          flutter pub get
          flutter build web --release --base-href /heRmes/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app_uth/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
